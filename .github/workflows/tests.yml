name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  manifests:
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Gemini CLI
        run: npm install --prefix "$RUNNER_TEMP/gemini-cli" --no-audit --no-fund @google/gemini-cli@0.62.0

      - name: Run tests
        run: uv run pytest tests/test_manifests.py tests/test_gemini_package.py -v --tb=short
        env:
          GEMINI_CLI: ${{ runner.temp }}/gemini-cli/node_modules/.bin/gemini

  skill-selection:
    name: Skill selection accuracy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/test_skill_selection_accuracy.py -v -n 8 --tb=short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  skill-quality:
    name: Skill quality review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/test_skill_quality.py -v -s --tb=short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
