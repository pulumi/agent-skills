# Queries that should activate the agent-context skill.
#
# This skill is a router across the three Pulumi surfaces:
#   L1 - `pulumi do` for ad-hoc CRUD with no project
#   L2 - Pulumi projects in a language
#   L3 - Pulumi Cloud (ESC, policy, deployments, drift, schedules)
#
# Queries below lean on the signals the routing judge actually picks up
# for this skill: explicit `pulumi do` verb-noun phrasings, multi-provider
# bootstrapping, tear-down / drift workflows, and "agent onboarding" intent.
#
# Deliberately omitted (and worth flagging in skill description tuning):
#   - generic "how do I X with Pulumi" — routes to pulumi-best-practices
#   - "schedule" / "run in Pulumi Cloud" — routes to pulumi-automation-api
#   - policy enforcement — routes to pulumi-best-practices
#   - single-resource creation w/o provider specificity ("create an S3 bucket")
#     — judge treats as generic infra, fires no skill
queries:
  # L1 - pulumi do, ad-hoc, no project files
  - "Use pulumi do to create a Cloudflare DNS record"
  - "I just need a one-off Auth0 application provisioned, no project files"
  - "Run a quick pulumi do command to register a Vercel deployment's domain in Cloudflare"
  - "Use Pulumi to create a Datadog monitor without scaffolding a full program"
  - "Delete the resource I created earlier with pulumi do"
  - "Provision an Azure virtual machine with pulumi do"
  - "Use pulumi do to create a Kubernetes namespace"

  # L1 - multi-provider bootstrapping in one place
  - "I need to provision an S3 bucket and point a Cloudflare DNS record at it"
  - "Stand up a GCP storage bucket and a Datadog monitor for it in one go"
  - "Bootstrap infrastructure across AWS, Cloudflare, and Auth0 from one CLI"
  - "Set up infrastructure that spans AWS, GCP, and Cloudflare in one workflow"
  - "Ad-hoc cloud resource CRUD across multiple providers without writing code"

  # L2 - new project, picking the right level
  - "Start a new Pulumi project in TypeScript for our AWS infrastructure"
  - "Bootstrap a Pulumi project that provisions a VPC, subnets, and an EKS cluster"
  - "Set up a Pulumi program for a multi-region application"

  # L2 - graduating from L1 ad-hoc work
  - "Move resources from a default stack into a named Pulumi project"

  # L3 - drift, lifecycle
  - "Set up nightly drift detection on my Pulumi production stack"

  # Lifecycle - tear-down
  - "Tear down our staging environment in Pulumi"
  - "Destroy the dev stack and all the resources it created"

  # Onboarding / first contact for AI coding agents
  - "I'm an agent that needs to use Pulumi -- where do I start?"
  - "I'm an AI coding agent setting up Pulumi for the first time, what do I need to know?"

