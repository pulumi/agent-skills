#   - "Spin up a single S3 bucket with Pulumi without setting up a project"  # no skill
#
# `pulumi do` verbs without strong provider/action signal — best-practices wins:
#   - "How do I patch a resource I created earlier with pulumi do?"          # pulumi-best-practices
#
# "How do I structure / new to Pulumi" — best-practices wins:
#   - "I'm new to Pulumi -- how do I structure a project for dev, staging, and prod stacks?"  # pulumi-best-practices
#
# L1 -> L2 graduation phrasing — automation-api + best-practices win:
#   - "I've been creating resources with pulumi do, now I want to move them into a real Pulumi project"  # pulumi-automation-api, pulumi-best-practices
#
# L3 schedule / hosted-run phrasings — judge confuses Deployments with Automation API:
#   - "Schedule a daily pulumi refresh in preview mode"                       # pulumi-automation-api
#   - "Run my Pulumi updates in Pulumi Cloud instead of on a CI runner"       # pulumi-automation-api, pulumi-best-practices
#
# L3 policy — best-practices wins:
#   - "Add policy enforcement to our Pulumi previews"                         # pulumi-best-practices
#
# Vague "right way / help me figure out" — automation-api + best-practices win:
#   - "What's the right way to use Pulumi from a coding agent?"               # pulumi-automation-api, pulumi-best-practices
#   - "Help me figure out whether to use pulumi do or a full Pulumi project for this task"  # pulumi-automation-api, pulumi-best-practices
